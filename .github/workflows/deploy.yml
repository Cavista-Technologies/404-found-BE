name: Deploy to SmarterASP
on:
 push:
   branches: [main]
 workflow_dispatch:
jobs:
 deploy:
   runs-on: windows-latest
   steps:
     - uses: actions/checkout@v4
     - uses: actions/setup-dotnet@v4
       with:
         dotnet-version: '8.0.x'
     - run: dotnet restore ./Cavista.CTRecruita.Web/Cavista.CTRecruita.Web.csproj
     - run: dotnet build ./Cavista.CTRecruita.Web/Cavista.CTRecruita.Web.csproj -c Release --no-restore
     - run: dotnet publish ./Cavista.CTRecruita.Web/Cavista.CTRecruita.Web.csproj -c Release --no-build -o ${{ github.workspace }}\publish
     - name: Inject production config
       shell: pwsh
       run: |
         $path = "${{ github.workspace }}\publish\appsettings.Production.json"
         $json = Get-Content $path -Raw | ConvertFrom-Json
         function Set-IfPresent($obj, $prop, $value) {
           if ([string]::IsNullOrWhiteSpace($value)) { return }
           if ($null -eq $obj) { return }
           if ($obj.PSObject.Properties.Name -notcontains $prop) { return }
           $obj.$prop = $value
         }
         Set-IfPresent $json.ConnectionStrings 'DefaultConnection'  '${{ secrets.PROD_DEFAULT_CONN }}'
         Set-IfPresent $json.ConnectionStrings 'ReadOnlyConnection' '${{ secrets.PROD_READONLY_CONN }}'
         Set-IfPresent $json.ConnectionStrings 'HangfireConn'       '${{ secrets.PROD_HANGFIRE_CONN }}'
         Set-IfPresent $json.SeriLog           'ConnectionString'   '${{ secrets.PROD_SERILOG_CONN }}'
         Set-IfPresent $json.JWT               'SigningKey'         '${{ secrets.PROD_JWT_SIGNING_KEY }}'
         Set-IfPresent $json.HangfireAuth      'Username'           '${{ secrets.PROD_HANGFIRE_USER }}'
         Set-IfPresent $json.HangfireAuth      'Password'           '${{ secrets.PROD_HANGFIRE_PASS }}'
         Set-IfPresent $json.Encrpyt           'Key'                '${{ secrets.PROD_ENCRYPT_KEY }}'
         $json | ConvertTo-Json -Depth 10 | Set-Content $path
     - name: Web Deploy
       shell: pwsh
       run: |
         $msdeploy = "C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe"
         $dest = "contentPath=${{ secrets.ASP_SITE_NAME }},computerName=${{ secrets.ASP_MSDEPLOY_URL }},userName=${{ secrets.ASP_USER }},password=${{ secrets.ASP_PASSWORD }},authType=Basic"
         & $msdeploy -verb:sync -source:contentPath="${{ github.workspace }}\publish" -dest:$dest -enableRule:AppOffline -enableRule:DoNotDeleteRule -allowUntrusted -retryAttempts:5 -retryInterval:3000
         if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
